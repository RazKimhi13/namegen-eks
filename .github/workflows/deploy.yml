# CI/CD: on every push to main -> build the namegen image -> push to ECR -> deploy to EKS (rolling update).
# Auth uses GitHub OIDC (NO long-lived AWS keys). Set up the role once with scripts/02-setup-github-oidc.sh,
# then put the role ARN in the repo secret AWS_ROLE_ARN.
name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write              # REQUIRED for GitHub OIDC -> AWS
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: namegen
  EKS_CLUSTER: namegen-cluster
  K8S_NAMESPACE: namegen
  MONITORING_NAMESPACE: monitoring
  INSTALL_MONITORING: "true"   # set "false" to skip the Grafana/Prometheus step

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Temporary credentials via STS AssumeRoleWithWebIdentity. The role's TRUST POLICY must use
      # GitHub's post-2026-07-15 subject format (owner ID + repo ID) or this step fails with
      # "Not authorized to perform sts:AssumeRoleWithWebIdentity" - see docs/GITHUB-OIDC-ASSUME-ROLE.md.
      # (The instructor's guide pins @v6.2.3; v4 works too - the action version was never the issue.)
      - name: Configure AWS credentials (OIDC - no static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" .        # Dockerfile + source are in the repo root
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update kubeconfig for the EKS cluster
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Apply manifests and roll out the new image
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/namegen namegen="$IMAGE" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/namegen -n "$K8S_NAMESPACE" --timeout=180s

      # Monitoring (project requirement): Prometheus collects, Grafana visualises, both as
      # pods inside the cluster. `helm upgrade --install` is idempotent, so this is a no-op
      # once installed. The Grafana password + port-forward stay OUT of CI on purpose -
      # a pipeline should never print a password into its logs.
      - name: Install/upgrade monitoring stack (Grafana + Prometheus)
        if: env.INSTALL_MONITORING == 'true'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace "$MONITORING_NAMESPACE" --create-namespace \
            --values monitoring/values.yaml \
            --wait --timeout 10m
          kubectl -n "$MONITORING_NAMESPACE" get pods
