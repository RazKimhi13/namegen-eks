# ALTERNATIVE CI/CD workflow using IAM user Access Keys (matches the official "DevOps - Step by Step").
# To use THIS instead of the OIDC deploy.yml: delete/disable deploy.yml, run scripts/02-setup-iam-user.sh,
# and set the repo secrets AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY.
# (deploy.yml with OIDC is the more secure option and is recommended - pick ONE.)
name: build-and-deploy (access keys)

on:
  workflow_dispatch: {}          # disabled on push by default so it doesn't clash with deploy.yml

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: namegen
  EKS_CLUSTER: namegen-cluster
  K8S_NAMESPACE: namegen
  MONITORING_NAMESPACE: monitoring
  INSTALL_MONITORING: "true"   # set "false" to skip the Grafana/Prometheus step

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (access keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER"

      - name: Apply manifests and roll out
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/namegen namegen="$IMAGE" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/namegen -n "$K8S_NAMESPACE" --timeout=180s

      # Monitoring (project requirement) - see the same step in deploy.yml for the rationale.
      - name: Install/upgrade monitoring stack (Grafana + Prometheus)
        if: env.INSTALL_MONITORING == 'true'
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update prometheus-community
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace "$MONITORING_NAMESPACE" --create-namespace \
            --values monitoring/values.yaml \
            --wait --timeout 10m
          kubectl -n "$MONITORING_NAMESPACE" get pods
